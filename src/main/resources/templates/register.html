<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Notary Appointment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" id="nav-brand">
                <i class="bi bi-pen-fill me-2"></i>E-Notary System
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="/login" id="nav-login-link">Already have an account? Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Registration Container -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill text-primary display-4"></i>
                            <h2 class="fw-bold mt-2">Create an Account</h2>
                            <p class="text-muted">Register as a Client seeking notarization or a Certified Notary Public</p>
                        </div>

                        <!-- Error Message Banner -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" id="register-error-banner">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Error registering account</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/register}" th:object="${registerForm}" method="post" id="form-register">

                            <!-- Account Type (Role Selection) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">I want to register as:</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" th:field="*{role}" value="CLIENT" id="role-client" checked onchange="toggleNotaryFields()">
                                        <label class="form-check-label fw-semibold" for="role-client">
                                            <i class="bi bi-person me-1"></i>Client (Citizen)
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" th:field="*{role}" value="NOTARY" id="role-notary" onchange="toggleNotaryFields()">
                                        <label class="form-check-label fw-semibold" for="role-notary">
                                            <i class="bi bi-award me-1"></i>Certified Notary Public
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="input-fullName" class="form-label">Full Legal Name</label>
                                <input type="text" class="form-control" th:field="*{fullName}" id="input-fullName" placeholder="e.g. John Doe" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="input-email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" th:field="*{email}" id="input-email" placeholder="name@example.com" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <label for="input-phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" th:field="*{phone}" id="input-phone" placeholder="+1 (555) 000-0000">
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="input-password" class="form-label">Password</label>
                                <input type="password" class="form-control" th:field="*{password}" id="input-password" placeholder="Minimum 6 characters" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Notary-Specific Profile Fields (Hidden by default for Clients) -->
                            <div id="notary-profile-section" class="border rounded p-3 bg-light mb-3" style="display: none;">
                                <h6 class="fw-bold text-primary mb-3">
                                    <i class="bi bi-file-earmark-lock me-1"></i>Notary Credentials
                                </h6>
                                <div class="mb-3">
                                    <label for="input-licenseNumber" class="form-label">State / Commission License #</label>
                                    <input type="text" class="form-control" th:field="*{licenseNumber}" id="input-licenseNumber" placeholder="e.g. NOT-98765-STATE">
                                </div>
                                <div class="mb-3">
                                    <label for="input-officeAddress" class="form-label">Office Address</label>
                                    <input type="text" class="form-control" th:field="*{officeAddress}" id="input-officeAddress" placeholder="123 Legal Way, Suite 400">
                                </div>
                                <div class="mb-3">
                                    <label for="input-specialization" class="form-label">Specialization</label>
                                    <input type="text" class="form-control" th:field="*{specialization}" id="input-specialization" placeholder="e.g. Real Estate Deeds, Affidavits, Wills">
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit-register">
                                <i class="bi bi-check-circle-fill me-2"></i>Create Account
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="text-muted small">Already registered? </span>
                            <a href="/login" class="small fw-bold">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 bg-white border-top text-center text-muted small mt-auto">
        Containerized E-Notary Appointment System &bull; Roll No: 23102C0055
    </footer>

    <script>
        function toggleNotaryFields() {
            const isNotary = document.getElementById('role-notary').checked;
            const section = document.getElementById('notary-profile-section');
            if (isNotary) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }
        document.addEventListener('DOMContentLoaded', toggleNotaryFields);
    </script>
</body>
</html>
