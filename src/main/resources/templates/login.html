<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - E-Notary Appointment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" id="nav-brand">
                <i class="bi bi-pen-fill me-2"></i>E-Notary System
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="/register" id="nav-register-link">Need an account? Register</a>
            </div>
        </div>
    </nav>

    <!-- Main Login Container -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                            <h2 class="fw-bold mt-2">Sign In</h2>
                            <p class="text-muted">Enter your credentials to access your appointments</p>
                        </div>

                        <!-- Feedback Alerts -->
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" id="login-success-banner">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span th:text="${successMessage}">Registration successful!</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert" id="login-info-banner">
                            <i class="bi bi-info-circle-fill me-2"></i>
                            <span th:text="${infoMessage}">Logged out</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" id="login-error-banner">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Invalid credentials</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post" id="form-login">
                            <div class="mb-3">
                                <label for="input-login-email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" name="email" id="input-login-email" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="input-login-password" class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" id="input-login-password" placeholder="Your password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit-login">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <span class="text-muted small">Don't have an account? </span>
                            <a href="/register" class="small fw-bold">Register Now</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 bg-white border-top text-center text-muted small mt-auto">
        Containerized E-Notary Appointment System &bull; Roll No: 23102C0055
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
